<VirtualHost *:80>
    ServerName 209.222.25.118
    DocumentRoot /var/www/empire-league

    <Directory /var/www/empire-league>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin
    ErrorLog /var/log/apache2/empire-league-error.log
    CustomLog /var/log/apache2/empire-league-access.log combined
</VirtualHost>
