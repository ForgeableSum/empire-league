<VirtualHost *:80>
    ServerName 209.222.25.118
    DocumentRoot /var/www/empire-league

    <Directory /var/www/empire-league>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Only the stable browser download is preview-gated. Auto-update clients
    # must be able to read latest.yml and its versioned artifacts unattended.
    <Directory /var/www/empire-league/updates/windows>
        <FilesMatch "^Empire-League-(Preview-)?Setup\.exe$">
            AuthType Basic
            AuthName "Empire League Preview"
            AuthUserFile /etc/apache2/empire-league-download.htpasswd
            Require valid-user
            Header always set Cache-Control "private, no-store, no-cache, must-revalidate"
            Header always set Pragma "no-cache"
        </FilesMatch>
    </Directory>

    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin
    ErrorLog /var/log/apache2/empire-league-error.log
    CustomLog /var/log/apache2/empire-league-access.log combined
</VirtualHost>
